<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Preço - Binance</title>
  <link rel="stylesheet" href="conversao-criptomoedas.css">
  <script defer src = "conversao-criptomoedas.js"></script>
</head>
<body>
  <div class="container">
    <h1>Consultar Preço de Moedas</h1>
    <label for="moedaBase">Moeda Base (Ex.: BTC):</label>
    <input type="text" id="moedaBase" placeholder="Digite a moeda base" list="sugestao-moedaBase">

    <label for="moedaConversao">Moeda Conversão (Ex.: USDT):</label>
    <input type="text" id="moedaConversao" placeholder="Digite a moeda de conversão" list="sugestao-moedaConversao">

    <div class="botoes">

      <button id="botaoConsultar">Consultar</button>
  
      <button id="botaoLimpar">Limpar</button>

      <button id="botaoInverter">Inverter moedas</button>

    </div>

    <datalist id="sugestao-moedaBase">
      <option value="BTC"></option>
      <option value="ETH"></option>
      <option value="SOL"></option>
      <option value="XRP"></option>
      <option value="DOGE"></option>
    </datalist>

    <datalist id="sugestao-moedaConversao">
      <option value="USDT"></option>
      <option value="BRL"></option>
    </datalist>


    <div id="resultado"></div>
  </div>

</body>
</html>
